name: opalatex
title: OpalaTex
version: "0.2.31"
summary: AI-assisted LaTeX editor and project IDE
description: |
  OpalaTex is a project-centric, AI-assisted LaTeX editor with a local
  Python backend, a React desktop interface, Git integration, and document
  export tools.

  OpalaTex is free and open source. AI features run through local Ollama
  models or through third-party providers configured with your own API key.

base: core24
grade: stable
confinement: strict
license: MIT
icon: AppIcons/OpalaTexArt1024.png
website:
  - https://www.opalacoder.com
source-code:
  - https://github.com/opalacoderdev/OpalaTex
issues:
  - https://github.com/opalacoderdev/OpalaTex/issues
contact:
  - dev@opalacoder.com
compression: lzo

lint:
  ignore:
    - library

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# Dead keys (^ + e -> ê) go through Qt's xkb compose input context, which needs
# the X11 Compose table for the user's locale. The gpu extension exposes the
# tables relocated under $SNAP/gpu-2404 and points XLOCALEDIR there, but the
# tables for pt_BR, pt_PT, ru_RU, cs_CZ, fi_FI and other locales include
# "/usr/share/X11/locale/en_US.UTF-8/Compose" by absolute path, and inside
# confinement that path is empty: libxkbcommon then fails to build the table
# and every dead key is silently swallowed. Binding the same tables at their
# real path makes those includes resolve.
#
# The bundled interpreter loads its standard library from the base snap's
# /usr/lib/python3.12, which has no ensurepip (Ubuntu ships it in
# python3.12-venv), and Debian's ensurepip reads pip's wheel from the absolute
# /usr/share/python-wheels. Without these two binds `python -m venv` in the
# integrated terminal creates the environment and then fails to bootstrap pip.
layout:
  /usr/share/X11/locale:
    bind: $SNAP/gpu-2404/usr/share/X11/locale
  /usr/lib/python3.12/ensurepip:
    bind: $SNAP/usr/lib/python3.12/ensurepip
  /usr/share/python-wheels:
    bind: $SNAP/usr/share/python-wheels

apps:
  opalatex:
    command: bin/opalatex-launch
    desktop: usr/share/applications/opalatex.desktop
    common-id: com.opalacoder.OpalaTex
    extensions:
      - gnome
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYWEBVIEW_GUI: qt
      QT_API: pyqt6
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QT_LOGGING_RULES: "*.debug=false;qt.qpa.*=false"
      OMP_NUM_THREADS: "4"
    plugs:
      - audio-playback
      - browser-support
      - docker
      - home
      - mount-observe
      - network
      - network-bind
      - removable-media
  # The monitor daemon (opalatex/monitors/, PROJECT_DESIGN 2.24). A confined
  # snap can neither write ~/.config/systemd nor run systemctl, so the login
  # start is snapd's own: the app writes opalatex-monitors.desktop into
  # $SNAP_USER_DATA/.config/autostart when "Start at login" is on, and the
  # session agent starts this app at the next login. Notifications go through
  # org.freedesktop.Notifications (the gnome extension's desktop plug) with
  # gdbus, staged from libglib2.0-bin below.
  monitors:
    command: bin/opalatex-launch monitors daemon
    autostart: opalatex-monitors.desktop
    extensions:
      - gnome
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: "4"
    plugs:
      - docker
      - home
      - network
      - removable-media

parts:
  opalatex:
    plugin: nil
    source: .
    build-snaps:
      - node/20/stable
    build-packages:
      - build-essential
      - ca-certificates
      - curl
      - libffi-dev
      - libssl-dev
      - pkg-config
      - python3-dev
      - python3-venv
    stage-packages:
      # espeak-ng (GPL-3.0) is loaded at runtime over ctypes and is deliberately
      # not vendored into the MIT source tree, but strict confinement hides the
      # host's copy, so the snap would ship a local voice that can never speak.
      # Staging the distro packages keeps the library out of the repository
      # while still giving the confined app something to dlopen; the snap as a
      # whole is then distributed under the GPL-3.0's terms, exactly as it
      # already is for the AGPL PyMuPDF payload.
      - espeak-ng-data
      - git
      - python3.12
      - python3.12-minimal
      - python3.12-venv
      - libasound2t64
      - libatk-bridge2.0-0
      - libatk1.0-0
      - libcairo2
      - libcups2t64
      - libdbus-1-3
      - libdrm2
      - libegl1
      - libespeak-ng1
      - libevent-2.1-7t64
      - libfontconfig1
      - libfreetype6
      - libgssapi-krb5-2
      - libgbm1
      - libgl1
      - libgl1-mesa-dri
      - libglx0
      # gdbus: desktop notifications and their click actions (opalatex/monitors/notify.py).
      - libglib2.0-bin
      - libgtk-3-0t64
      - libice6
      - libminizip1t64
      - libnspr4
      - libnss3
      - libopengl0
      - libopus0
      - libpango-1.0-0
      - libpulse0
      - libre2-10
      - libsm6
      - libsnappy1v5
      - libwayland-client0
      - libwoff1
      - libx11-6
      - libx11-xcb1
      - libxcb-cursor0
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shm0
      - libxcb-shape0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xinput0
      - libxcb-xkb1
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon-x11-0
      - libxkbcommon0
      - libxkbfile1
      - libxrandr2
      - libxrender1
      - libxshmfence1
      - libxss1
      - libxtst6
      - pandoc
      # Deliberately no xdg-utils: $SNAP/usr/bin precedes /usr/bin on PATH, so a
      # staged xdg-open shadows the base snap's shim (`exec snapctl user-open`),
      # which is the only opener that can reach the host session from inside
      # confinement. Nothing here calls the other xdg-* tools.
    override-build: |
      set -eu

      cd gui_src
      npm ci
      npm run build
      cd ..

      test -f opalatex/gui/index.html

      python3 -m venv --copies "$CRAFT_PART_INSTALL"
      "$CRAFT_PART_INSTALL/bin/python" -m pip install --upgrade pip setuptools wheel
      "$CRAFT_PART_INSTALL/bin/python" -m pip install ".[gui]"
      # The snap ships whatever Qt pip resolved here; refuse one below the
      # verified floor or mixing Qt releases, as the release builds do.
      "$CRAFT_PART_INSTALL/bin/python" scripts/check_qt_runtime.py
      "$CRAFT_PART_INSTALL/bin/python" -c "from opalatex.assetstore import list_assets; assets = list_assets('template'); assert len(assets) > 0, 'No templates found in assetstore'"

      # The Google OAuth client is .gitignore'd, so a packaging rule that drops
      # VCS-ignored files removes it without a word and the snap ships with Cloud
      # sync unable to connect at all. If the source tree has one, the installed
      # package must have it too.
      if [ -f opalatex/cloud/providers/bundled_google_client.json ]; then
        "$CRAFT_PART_INSTALL/bin/python" -c "import os, opalatex.cloud.providers as p; f = os.path.join(os.path.dirname(p.__file__), 'bundled_google_client.json'); assert os.path.isfile(f), 'The build dropped bundled_google_client.json: Cloud sync would ship unable to connect'"
      else
        echo "WARNING: no bundled_google_client.json in the source tree; this snap ships without a Google OAuth client and Cloud sync will not connect."
      fi

      # The venv above was made by the gnome SDK's python3, a build-only snap, so
      # pyvenv.cfg names it as `home`. At runtime that path does not exist, and
      # `python -m venv` from the integrated terminal links the new environment's
      # bin/python to it ("No such file or directory: .venv/bin/python"). The
      # copied binary already takes its standard library from the base snap's
      # /usr (sys.base_prefix), so its base interpreter is /usr/bin. This runs
      # after the pip installs so the build itself still uses the SDK's python.
      sed -i 's#^home = .*#home = /usr/bin#' "$CRAFT_PART_INSTALL/pyvenv.cfg"
      grep -qx 'home = /usr/bin' "$CRAFT_PART_INSTALL/pyvenv.cfg"

      mkdir -p "$CRAFT_PART_INSTALL/bin"
      curl -L "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz" -o tectonic.tar.gz
      tar -xzf tectonic.tar.gz -C "$CRAFT_PART_INSTALL/bin"
      rm tectonic.tar.gz
      chmod +x "$CRAFT_PART_INSTALL/bin/tectonic"

      curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-29.9.2.tgz" -o docker.tgz
      tar -xzf docker.tgz -C "$CRAFT_PART_INSTALL/bin" --strip-components=1 docker/docker
      rm docker.tgz
      chmod +x "$CRAFT_PART_INSTALL/bin/docker"

      install -Dm755 snap/local/opalatex-launch "$CRAFT_PART_INSTALL/bin/opalatex-launch"
      install -Dm644 snap/gui/opalatex.desktop "$CRAFT_PART_INSTALL/usr/share/applications/opalatex.desktop"
    override-prime: |
      set -eu
      craftctl default

      arch_triplet="${CRAFT_ARCH_TRIPLET_BUILD_FOR:-x86_64-linux-gnu}"

      # A local voice is silent without both halves of espeak-ng, and the
      # failure only shows up at synthesis time on a user's machine, so the
      # build refuses to ship a snap that is missing either one.
      espeak_lib="$CRAFT_PRIME/usr/lib/$arch_triplet/libespeak-ng.so.1"
      if [ ! -f "$espeak_lib" ]; then
        echo "Missing $espeak_lib: local voices would report espeak-ng as not installed."
        exit 1
      fi
      espeak_data=""
      for candidate in "$CRAFT_PRIME"/usr/lib/*/espeak-ng-data "$CRAFT_PRIME"/usr/share/espeak-ng-data; do
        if [ -f "$candidate/phontab" ]; then
          espeak_data="$candidate"
          break
        fi
      done
      if [ -z "$espeak_data" ]; then
        echo "Missing espeak-ng-data in the prime tree: espeak_Initialize would fail at runtime."
        exit 1
      fi

      # The staged pandoc reads its data files at runtime (the launcher points
      # pandoc_datadir at them); without them every DOCX export fails.
      pandoc_data="$CRAFT_PRIME/usr/share/pandoc/data/abbreviations"
      if [ ! -f "$pandoc_data" ]; then
        echo "Missing $pandoc_data: DOCX export would fail at runtime."
        exit 1
      fi

      # The ensurepip and python-wheels layouts bind these; without them a venv
      # made in the integrated terminal has no pip.
      if [ ! -f "$CRAFT_PRIME/usr/lib/python3.12/ensurepip/__init__.py" ]; then
        echo "Missing staged ensurepip: python -m venv would fail at runtime."
        exit 1
      fi
      if ! ls "$CRAFT_PRIME"/usr/share/python-wheels/pip-*.whl >/dev/null 2>&1; then
        echo "Missing staged pip wheel: python -m venv would fail at runtime."
        exit 1
      fi

      qt_lib_dir="$CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/Qt6/lib"
      export LD_LIBRARY_PATH="$CRAFT_PRIME/lib:$CRAFT_PRIME/lib/$arch_triplet:$CRAFT_PRIME/usr/lib:$CRAFT_PRIME/usr/lib/$arch_triplet:$qt_lib_dir:${LD_LIBRARY_PATH:-}"

      check_libs="
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtCore.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtGui.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtWidgets.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtNetwork.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtWebEngineCore.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtWebEngineWidgets.abi3.so
      "
      missing="$(
        for lib in $check_libs; do
          if [ -f "$lib" ]; then
            ldd "$lib" 2>/dev/null
          else
            echo "Required PyQt6 module missing: $lib"
          fi
        done | grep -E 'not found|Required PyQt6 module missing' | sort -u || true
      )"
      if [ -n "$missing" ]; then
        echo "Unresolved native dependencies in PyQt6 payload:"
        echo "$missing"
        exit 1
      fi
