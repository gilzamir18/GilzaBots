name: Build and Release GilzaBots Community

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish as a GitHub Release. Leave empty to build the current branch without publishing.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest is an Apple Silicon (arm64) runner, so the macOS asset is
        # arm64; it used to be published as "macos-x64", which install.sh then
        # refused on Apple Silicon and which cannot run on an Intel Mac.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A manual run that names a tag must build that tag's code, never the
          # branch the workflow was dispatched from.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A build that is going to be published must carry the Google OAuth client.
      # Without it every install from the release — which is what install.ps1 and
      # install.sh hand the user — has Cloud sync unable to open the Google
      # sign-in at all, and the app can only tell the user to go register
      # credentials in the Google Cloud console. The build scripts treat the
      # client as optional so a fork or a branch build still works; a release
      # cannot afford that, so it fails here, before 20 minutes of packaging.
      - name: Require the Google OAuth client for a published build
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        shell: bash
        env:
          GILZABOTS_GDRIVE_CLIENT_ID: ${{ secrets.GILZABOTS_GDRIVE_CLIENT_ID }}
          GILZABOTS_GDRIVE_CLIENT_SECRET: ${{ secrets.GILZABOTS_GDRIVE_CLIENT_SECRET }}
        run: |
          missing=""
          [ -z "$GILZABOTS_GDRIVE_CLIENT_ID" ] && missing="GILZABOTS_GDRIVE_CLIENT_ID"
          [ -z "$GILZABOTS_GDRIVE_CLIENT_SECRET" ] && missing="$missing GILZABOTS_GDRIVE_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Set them under Settings -> Secrets and variables -> Actions, then re-run this release. Publishing without them ships an app whose Cloud sync cannot connect."
            exit 1
          fi

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # The Google OAuth client is optional for branch and fork builds only:
        # the step above makes it mandatory for anything published.
        env:
          GILZABOTS_GDRIVE_CLIENT_ID: ${{ secrets.GILZABOTS_GDRIVE_CLIENT_ID }}
          GILZABOTS_GDRIVE_CLIENT_SECRET: ${{ secrets.GILZABOTS_GDRIVE_CLIENT_SECRET }}
          GILZABOTS_X_CLIENT_ID: ${{ secrets.GILZABOTS_X_CLIENT_ID }}
        run: .\build_exe.ps1

      # PyInstaller bundles a library only if the build machine has it; a missing
      # one is a warning, not an error. Qt's xcb platform plugin links these nine
      # X11 client libraries and the runner image carries none of them, so the
      # release shipped without them and aborted on a stock desktop with "no Qt
      # platform plugin could be initialized" until the user apt-installed them.
      # build_exe.sh refuses a bundle that still lacks any of them.
      - name: Install the Qt xcb libraries the Linux bundle must carry
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Build Linux/macOS
        if: matrix.os != 'windows-latest'
        env:
          GILZABOTS_GDRIVE_CLIENT_ID: ${{ secrets.GILZABOTS_GDRIVE_CLIENT_ID }}
          GILZABOTS_GDRIVE_CLIENT_SECRET: ${{ secrets.GILZABOTS_GDRIVE_CLIENT_SECRET }}
          GILZABOTS_X_CLIENT_ID: ${{ secrets.GILZABOTS_X_CLIENT_ID }}
        run: |
          chmod +x build_exe.sh
          ./build_exe.sh

      # Having the secret does not prove the file reached the bundle: it is added
      # through a separate --add-data argument, and PyInstaller drops a missing
      # data file with a warning rather than an error. This is the check that the
      # published release v0.2.10 would have failed.
      - name: Verify the packaged app carries the OAuth client
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        shell: bash
        run: |
          found=$(find dist -name bundled_google_client.json | head -1)
          if [ -z "$found" ]; then
            echo "::error::The packaged app has no bundled_google_client.json. Cloud sync would ship unable to connect."
            exit 1
          fi
          echo "OAuth client packaged at $found"

      # The X connector signs in only through the X app a release carries
      # (gilzabots/connectors/bundled_clients.py). Optional until the secret
      # exists; once it does, the packaged file must be there.
      - name: Verify the packaged app carries the X app (when configured)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        shell: bash
        env:
          GILZABOTS_X_CLIENT_ID: ${{ secrets.GILZABOTS_X_CLIENT_ID }}
        run: |
          if [ -z "$GILZABOTS_X_CLIENT_ID" ]; then
            echo "::warning::GILZABOTS_X_CLIENT_ID is not set: this release cannot connect to X."
            exit 0
          fi
          found=$(find dist -name bundled_oauth_clients.json | head -1)
          if [ -z "$found" ]; then
            echo "::error::The packaged app has no bundled_oauth_clients.json. The X connector would ship unable to sign in."
            exit 1
          fi
          echo "X app packaged at $found"

      - name: Package Release Assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GilzaBots\* -DestinationPath GilzaBots-windows-x64.zip -Force

      - name: Package Release Assets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czf GilzaBots-linux-x64.tar.gz -C dist/GilzaBots .

      - name: Package Release Assets (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist/GilzaBots
          zip -r ../../GilzaBots-macos-arm64.zip .

      - name: Upload Windows Asset
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GilzaBots-windows-x64
          path: GilzaBots-windows-x64.zip

      - name: Upload Linux Asset
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GilzaBots-linux-x64
          path: GilzaBots-linux-x64.tar.gz

      - name: Upload macOS Asset
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GilzaBots-macos-arm64
          path: GilzaBots-macos-arm64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publish on a tag push, and also on a manual run that explicitly names a
    # tag. Without the second case a workflow_dispatch run builds the assets and
    # then silently drops them, leaving the release with no downloads and both
    # installers failing with a 404.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-assets/GilzaBots-windows-x64/GilzaBots-windows-x64.zip
            release-assets/GilzaBots-linux-x64/GilzaBots-linux-x64.tar.gz
            release-assets/GilzaBots-macos-arm64/GilzaBots-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
